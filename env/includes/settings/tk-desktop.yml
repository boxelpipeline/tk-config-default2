################################################################################

includes:
- ../app_locations.yml
- ../engine_locations.yml

################################################################################

# site
settings.tk-desktop.site:
  apps:
    tk-desktop-workload:
      location: "@apps.tk-desktop-workload.location"
  # The "Boxel" tab opens Workload in Desktop's own process: it stays
  # open across project / pipeline configuration switches.
  run_at_startup:
  - {app_instance: "", name: Apps}
  - {app_instance: tk-desktop-workload, name: Boxel}
  location: "@engines.tk-desktop.location"


# project
settings.tk-desktop.project:
  apps:
    bxl-slack-manager:
      location: "@apps.bxl-slack-manager.location"
    bxl-auto-playlist-manager:
      location: "@apps.bxl-auto-playlist-manager.location"
    tk-app-janus:
      location: "@apps.tk-app-janus.location"
  groups:
  - matches:
    - "*Janus*"
    name: Vendors
  default_group: "Production Tools"
  location: "@engines.tk-desktop.location"
